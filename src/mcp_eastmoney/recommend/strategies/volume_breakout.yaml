# 放量突破：当日放量上涨突破（量比+涨幅+换手共振）
name: volume_breakout
display_name: 放量突破
description: 当日量比≥2、涨幅2~7%、换手活跃的中盘股，捕捉资金进场初段
version: "1.0"
style: 打板/趋势
hard_filters:
  exclude_st: true
  amount_min: 200000000        # 成交额 ≥ 2亿
  change_pct_min: 2.0
  change_pct_max: 7.0          # 避开一字板（买不进）
  price_min: 3
  price_max: 100
  volume_ratio_min: 2.0
  turnover_min: 3.0
  total_mv_min: 30             # 总市值 ≥ 30亿（排除纯壳）
factor_weights:
  volume_ratio: 0.40
  turnover_rate: 0.25
  change_pct: 0.20
  amount: 0.15
